<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - Contact</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header & Navigation -->
  <header>
    <div class="logo">PORTFOLIO</div>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="portfolio.html">Portfolio</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="contact-section">
      <h1>Contact Me</h1>
      <p>Have a question or want to collaborate? Feel free to leave a message below.</p>

      <!-- Contact Form -->
      <form action="#" method="POST" class="contact-form">
        
        <div class="form-group">
          <label for="name">Full Name *</label>
          <input type="text" id="name" name="name" placeholder="Enter your full name" required>
        </div>

        <div class="form-group">
          <label for="email">Email Address *</label>
          <input type="email" id="email" name="email" placeholder="name@email.com" required>
        </div>

        <div class="form-group">
          <label for="category">Category / Inquiry *</label>
          <select id="category" name="category" required>
            <option value="" disabled selected>-- Select Inquiry Type --</option>
            <option value="consultation">Consultation</option>
            <option value="collaboration">Project Collaboration</option>
            <option value="general">General Question</option>
          </select>
        </div>

        <div class="form-group">
          <label for="message">Message *</label>
          <textarea id="message" name="message" rows="5" placeholder="Write your detailed message here..." required></textarea>
        </div>

        <button type="submit" class="btn-submit">Send Message</button>

      </form>
    </section>
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 Full Name. Built with Semantic HTML & Vanilla CSS.</p>
  </footer>

</body>
</html>
