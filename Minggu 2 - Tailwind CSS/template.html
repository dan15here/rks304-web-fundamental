<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Template - My E-Commerce</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex flex-col bg-gray-100 text-gray-800">

  <!-- Header -->
  <header class="w-full bg-indigo-600 text-white px-6 py-4 shadow flex items-center justify-between">
    <h1 class="text-4xl">My E-Commerce</h1>
    <a href="index.html" class="text-sm font-medium bg-indigo-700 hover:bg-indigo-800 px-3 py-1.5 rounded-md transition">
      Logout
    </a>
  </header>

  <!-- Layout utama -->
  <div class="flex flex-1">

    <!-- Sidebar -->
    <aside class="w-64 bg-white p-4 border-r border-gray-200">
      <nav class="space-y-1" aria-label="Navigasi utama">
        <a href="dashboard.html" class="block px-3 py-2 text-gray-600 hover:bg-gray-100 font-medium rounded-md transition">
          Dashboard
        </a>
        <a href="products.html" class="block px-3 py-2 text-gray-600 hover:bg-gray-100 font-medium rounded-md transition">
          Products
        </a>
        <a href="#" class="block px-3 py-2 text-gray-600 hover:bg-gray-100 font-medium rounded-md transition">
          Users
        </a>
        <a href="#" class="block px-3 py-2 text-gray-600 hover:bg-gray-100 font-medium rounded-md transition">
          Setting
        </a>
      </nav>
    </aside>

    <!-- Konten halaman -->
    <main class="flex-1 p-6 space-y-6">
      <article class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
        <h2 class="text-2xl font-bold text-gray-900 mb-2">Judul Halaman</h2>
        <p class="text-gray-600 leading-relaxed">
          Tambahkan deskripsi singkat halaman di sini.
        </p>
      </article>

      <!-- Tambahkan komponen atau konten halaman di bawah baris ini -->
      <section class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
        <h3 class="text-xl font-bold text-gray-900 mb-4">Konten Utama</h3>
        <p class="text-gray-600">
          Ganti bagian ini dengan konten halaman yang ingin dibuat.
        </p>
      </section>
    </main>
  </div>

  <!-- Footer -->
  <footer class="bg-white border-t border-gray-200 text-center text-sm text-gray-500 py-4">
    &copy; 2026 Muhammad Danish. All rights reserved.
  </footer>

</body>
</html>
