<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - My E-Commerce</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex flex-col bg-gray-100 text-gray-800">

    <header class="w-full bg-indigo-600 text-white px-6 py-4 shadow flex items-center justify-between">
        <h1 class="text-4xl">My E-Commerce</h1>
        <a href="index.html" class="text-sm font-medium bg-indigo-700 hover:bg-indigo-800 px-3 py-1.5 rounded-md transition">Logout</a>
    </header>

    <div class="flex flex-1">

        <aside class="w-64 bg-white p-4 border-r border-grey-200">
            <nav class="space-y-1">
                <a href="dashboard.html" class="block px-3 py-2 text-gray-600 hover:bg-gray-100 font-medium rounded-md">Dashboard</a>
                <a href="products.html" class="block px-3 py-2 text-grey-600 bg-blue-500 font-medium rounded-md">Products</a>
                <a href="#" class="block px-3 py-2 text-gray-600 hover:bg-gray-100 font-medium rounded-md">Users</a>
                <a href="#" class="block px-3 py-2 text-gray-600 hover:bg-gray-100 font-medium rounded-md">Setting</a>
            </nav>
        </aside>

        <main class="flex-1 p-6 space-y-6">
            <article class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
                <div class="flex items-center justify-between gap-4">
                    <div>
                        <h2 class="text-2xl font-bold text-gray-900 mb-2">Manajemen Produk</h2>
                        <p class="text-gray-600 leading-relaxed">Kelola nama dan jumlah stok produk toko.</p>
                    </div>
                    <a href="add-produk.html" class="bg-blue-500 hover:bg-blue-600 text-white font-medium px-4 py-2 rounded-md transition">Add Product</a>
                </div>
            </article>

            <article class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
                <div class="p-6 border-b border-gray-200">
                    <h3 class="text-xl font-bold text-gray-900">Product List</h3>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead class="bg-gray-50 text-gray-600 text-sm">
                            <tr>
                                <th class="px-6 py-3 font-medium">No</th>
                                <th class="px-6 py-3 font-medium">Name</th>
                                <th class="px-6 py-3 font-medium">Stock</th>
                                <th class="px-6 py-3 font-medium">Action</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-200">
                            <tr>
                                <td class="px-6 py-4 text-gray-600">1</td>
                                <td class="px-6 py-4 font-medium text-gray-900">Wireless Headphones</td>
                                <td class="px-6 py-4 text-gray-600">45</td>
                                <td class="px-6 py-4 space-x-2"><a href="edit-produk.html" class="inline-block text-sm bg-amber-500 text-white px-3 py-1.5 rounded-md">Edit</a><a href="#" class="inline-block text-sm bg-red-500 text-white px-3 py-1.5 rounded-md">Delete</a></td>
                            </tr>
                            <tr>
                                <td class="px-6 py-4 text-gray-600">2</td>
                                <td class="px-6 py-4 font-medium text-gray-900">Running Shoes</td>
                                <td class="px-6 py-4 text-gray-600">28</td>
                                <td class="px-6 py-4 space-x-2"><a href="edit-produk.html" class="inline-block text-sm bg-amber-500 text-white px-3 py-1.5 rounded-md">Edit</a><a href="#" class="inline-block text-sm bg-red-500 text-white px-3 py-1.5 rounded-md">Delete</a></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </article>
        </main>
    </div>
    <footer class="bg-white border-t border-gray-200 text-center text-sm text-gray-500 py-4">&copy; 2026 Muhammad Danish. All rights reserved.</footer>
</body>
</html>
