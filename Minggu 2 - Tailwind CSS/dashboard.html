<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - My E-Commerce</title>
  <!-- CDN Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex flex-col bg-gray-100 text-gray-800">

  <!-- Header -->
 <header class="w-full bg-indigo-600 text-white px-6 py-4 shadow flex items-center justify-between">
    <h1 class="text-4xl">My E-Commerce</h1>
    <a href="index.html" class="text-sm font-medium bg-indigo-700 hover:bg-indigo-800 px-3 py-1.5 rounded-md transition">Logout</a>
  </header>

  <!-- Container Utama (Sidebar + Main) -->
  <div class="flex flex-1">

    <!-- Aside (Menu Kiri) -->
    <aside class="w-64 bg-white p-4 border-r border-grey-200">
      <nav class="space-y-1">
        <a href="dashboard.html" class="block px-3 py-2 text-grey-600 bg-blue-500 font-medium rounded-md">Dashboard</a>
        <a href="products.html" class="block px-3 py-2 text-gray-600 hover:bg-gray-100 font-medium rounded-md">Products</a>
        <a href="#" class="block px-3 py-2 text-gray-600 hover:bg-gray-100 font-medium rounded-md">Users</a>
        <a href="#" class="block px-3 py-2 text-gray-600 hover:bg-gray-100 font-medium rounded-md">Setting</a>
      </nav>
    </aside>

    <!-- Main Content (Area Kanan) -->
    <main class="flex-1 p-6 space-y-6">

      <article class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
        <h2 class="text-2xl font-bold text-gray-900 mb-2">Dashboard</h2>
        <p class="text-gray-600 leading-relaxed">Pantau performa toko dan statistik e-commerce Anda.</p>
      </article>

      <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4">
        <div class="p-6 rounded-lg shadow-sm bg-blue-500 text-white"><h2 class="font-medium">Total Penjualan</h2><p class="text-3xl font-bold mt-2">Rp10.000.000</p></div>
        <div class="p-6 rounded-lg shadow-sm bg-emerald-500 text-white"><h2 class="font-medium">Total Pesanan</h2><p class="text-3xl font-bold mt-2">150</p></div>
        <div class="p-6 rounded-lg shadow-sm bg-amber-500 text-white"><h2 class="font-medium">Pelanggan Baru</h2><p class="text-3xl font-bold mt-2">25</p></div>
        <div class="p-6 rounded-lg shadow-sm bg-rose-500 text-white"><h2 class="font-medium">Produk Terjual</h2><p class="text-3xl font-bold mt-2">328</p></div>
      </div>

    </main>

  </div>

  <footer class="bg-white border-t border-gray-200 text-center text-sm text-gray-500 py-4">
    &copy; 2026 Muhammad Danish. All rights reserved.
  </footer>

</body>
</html>
