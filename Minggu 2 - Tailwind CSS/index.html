<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - My E-Commerce</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-gray-100 px-4 text-gray-800">

  <main class="w-full max-w-md">
    <section class="bg-white p-8 rounded-lg shadow-sm border border-gray-200">
      <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-indigo-600">My E-Commerce</h1>
        <p class="text-gray-600 mt-2">Masuk ke akun Anda</p>
      </div>

      <form action="dashboard.html" method="get" class="space-y-5">
        <div>
          <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="Masukkan username"
            autocomplete="username"
            required
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
          >
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Masukkan password"
            autocomplete="current-password"
            required
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
          >
        </div>

        <button
          type="submit"
          class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-4 py-2.5 rounded-md transition"
        >
          Login
        </button>
      </form>
    </section>

    <p class="text-center text-sm text-gray-500 mt-6">&copy; 2026 Muhammad Danish. All rights reserved.</p>
  </main>

</body>
</html>
