<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>
    <link rel="stylesheet" href="style.css"> 
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
</head>
<body class="container">
    <header>
        <nav class="navbar">
            <ul>
                <li><a class="nav-link" href="index.html">Home</a></li>
                <li><a class="nav-link" href="portfolio.html">Portfolio</a></li> 
                <li><a class="nav-link active" href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="contact-hero">
            <h1>Get in Touch</h1>
            <p>Have a project proposal, collaboration idea or general inquiry? Fill out the form below. </p>
        </section>

        <section class="contact-card">
            <form action="#" method="POST" class="contact-formt">

                <div class="form-group">
                    <label for="full-name">Full Name</label>
                    <input type="text" id="full-name" name="name" placeholder="Input your name" required`>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Input your valid email" required`>
                </div>

                <div class="form-group">
                    <label for="category">Category / Purpose</label>
                    <select id="category" name="category" required>
                        <option value="" disabled selected>Select a topic...</option>
                        <option value="consultation">consultation</option>
                        <option value="collaboration">collaboration</option>
                        <option value="general">General Inquiry</option>
                    </select>
                </div>


            </form>
        </section>

    </main>

    <footer>
    </footer>

</body>
</html>
